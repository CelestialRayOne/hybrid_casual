<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Gem Dig</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #3a2418;
        -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; }
      #safe-probe {
        position: fixed; visibility: hidden; pointer-events: none;
        top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
        bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
      }
    </style>
    <!-- CrazyGames SDK v3: loaded from the official URL, never bundled. Off-portal it reports environment "disabled". -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-probe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
